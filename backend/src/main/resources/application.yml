spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/security_db
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql

  application:
   security:
    jwt:
     secret-key: ${SECRET_KEY}

